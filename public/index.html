<!DOCTYPE html>
<html lang="ru" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Ai Ассистент</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
  <div class="app-layout">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="sidebar-drawer" id="sidebarDrawer" aria-label="История чатов">
      <div class="drawer-header">
        <h2 class="drawer-title">История чатов</h2>
        <button class="icon-btn close-drawer-btn" id="closeDrawerBtn" aria-label="Закрыть историю">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="drawer-actions">
        <button class="new-chat-btn" id="drawerNewChatBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Новый чат</span>
        </button>
      </div>
      <div class="drawer-history" id="drawerHistory"></div>
      <div class="drawer-footer">
        <button class="theme-footer-btn" id="drawerThemeToggleBtn">
          <span class="theme-footer-icon" id="drawerThemeIcon"></span>
          <span class="theme-footer-label" id="drawerThemeLabel">Светлая тема</span>
        </button>
      </div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <div class="header-left">
          <button class="icon-btn" id="openDrawerBtn" aria-label="Открыть историю чатов">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="4"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </button>
        </div>
        <div class="header-center">
          <h1 class="chat-title">Ai Ассистент</h1>
          <div class="chat-status">
            <span class="status-dot"></span>
            <span class="status-text">Онлайн</span>
          </div>
        </div>
        <div class="header-right">
          <button class="icon-btn" id="headerThemeToggleBtn" aria-label="Сменить тему">
            <span id="headerThemeIcon"></span>
          </button>
          <button class="icon-btn" id="headerNewChatBtn" aria-label="Создать новый чат">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="chat-viewport" id="chatViewport">
        <div class="date-badge-container">
          <div class="date-badge" id="chatDateBadge">Сегодня, 19:42</div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="typing-container" id="typingContainer">
          <div class="assistant-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z">
              </path>
            </svg>
            <span>Печатает...</span>
          </div>
          <div class="typing-bubble">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        </div>
      </section>

      <footer class="chat-footer">
        <form class="input-form" id="chatForm">
          <div class="input-capsule">
            <textarea class="message-input" id="messageInput" rows="1" placeholder="Сообщение..." maxlength="4000"
              autocomplete="off" autocorrect="on"></textarea>
            <button type="submit" class="send-btn" id="sendBtn" aria-label="Отправить сообщение">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </form>
      </footer>
  </div>
  <div class="access-blocked-overlay" id="accessBlockedOverlay">
    <div class="access-blocked-card">
      <div class="access-blocked-icon">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2 class="access-blocked-title">Доступ ограничен</h2>
    </div>
  </div>
  <script src="app.js"></script>
</body>

</html>
